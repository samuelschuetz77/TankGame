services:
  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    network_mode: host
    working_dir: /src/GameApi
    command: dotnet watch run --non-interactive
    environment:
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
    volumes:
      - ..:/src

  frontend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    network_mode: host
    working_dir: /src/GameFrontend
    command: dotnet watch run --non-interactive
    environment:
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
    volumes:
      - ..:/src
